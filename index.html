<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TheoApp</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6b1a1f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1d2433;--mut:#6b7280;--pri:#6b1a1f;--acc:#e0aa3c;--line:#e3ddd0;--ok:#2e7d4f;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
header{background:var(--pri);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}header small{opacity:.75}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.item:last-child{border:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.mut{color:var(--mut);font-size:13px}
button,.btn{font:inherit;border:0;border-radius:9px;padding:9px 14px;background:var(--pri);color:#fff;cursor:pointer}
button.sec{background:#e9e4d6;color:var(--ink)}button.bad{background:var(--bad)}button.sm{padding:5px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;color:var(--ink);font-size:15px}.chk input{width:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:8px 2px;font-size:11px;color:var(--mut);cursor:pointer}nav a b{display:block;font-size:20px;font-weight:400}nav a.on{color:var(--pri);font-weight:700}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;background:#e9e4d6}.pill.ok{background:#dff3e3;color:var(--ok)}.pill.no{background:#fde0e0;color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.stat b{font-size:22px;display:block}
.modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modal>div{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid var(--line);padding:4px 6px;text-align:center}th{background:#e9e4d6}td:first-child,th:first-child{text-align:left}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:99px;z-index:30}
.lock{position:fixed;inset:0;background:var(--pri);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.lock input{max-width:200px;text-align:center;font-size:22px}
@keyframes sp{0%{opacity:0;transform:translateY(8px)}18%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}
.splash{position:fixed;inset:0;background:var(--pri);color:#fff;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px}
.splash .logo{width:84px;height:84px;border-radius:50%;background:var(--acc);color:var(--pri);display:grid;place-items:center;font:700 44px Georgia,serif}
.splash h1{font:700 30px Georgia,serif;margin:0;animation:sp 4s ease both}.splash p{font-size:19px;line-height:1.4;max-width:320px;margin:0;animation:sp 7.5s ease both}.splash small{opacity:.6;position:absolute;bottom:24px}
@media (prefers-reduced-motion:reduce){.splash h1,.splash p{animation:none}}
.seg{display:flex;gap:6px;margin:0 0 10px}.seg button{flex:1;background:#e9e4d6;color:var(--ink)}.seg button.on{background:var(--pri);color:#fff}.late{color:var(--bad)}
@media print{header,nav,.noprint,button,.seg,select,.toast{display:none!important}body{background:#fff;padding:0}.card{border:0;break-inside:avoid}body.pm main{display:none}body.pm .modal{position:static;background:none;display:block}body.pm .modal>div{max-height:none;overflow:visible;padding:0;border-radius:0;max-width:none}}
.board{background:#f3e6c8;border:3px solid #a9793a;border-radius:14px;padding:12px;margin:12px 0;box-shadow:inset 0 0 0 2px #fff6;color:#3b2a12}
.board h3{margin:0 0 10px;display:flex;align-items:center;gap:8px;color:#5b3d12}
.note{background:#fffdf3;border-radius:6px;padding:10px 12px 10px 14px;margin:0 0 10px;border-left:4px solid #c2453a;box-shadow:0 2px 4px #0003;position:relative;color:#2b2b2b}
.note b{display:block;margin-bottom:2px}.note .who{font-size:12px;color:#777;margin-top:6px}.note .pin{position:absolute;top:-8px;right:10px;font-size:18px}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
nav a svg{width:23px;height:23px;display:block;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.drawer{position:fixed;inset:0;background:#0007;z-index:30}.drawer>div{position:absolute;right:0;top:0;bottom:0;width:82%;max-width:330px;background:var(--bg);padding:14px 16px;overflow:auto;box-shadow:-4px 0 14px #0004}
.drawer a{display:flex;gap:14px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);font-size:16px;cursor:pointer;color:var(--ink)}
.drawer .sec2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 2px}
nav .wideOnly{display:none}
@media(min-width:900px){nav{top:0;right:auto;width:240px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:64px 0 10px;justify-content:flex-start;overflow:auto}
nav a{flex:none;display:flex;align-items:center;gap:14px;text-align:left;font-size:15px;padding:13px 20px}nav a svg{margin:0}nav a.on{background:#0000000a;border-left:4px solid var(--pri);padding-left:16px}
nav .wideOnly{display:flex}nav .wsep{height:1px;background:var(--line);margin:8px 16px}
main{margin-left:240px!important;max-width:820px;padding-bottom:30px!important}.menuBtn{display:none!important}.drawer{display:none!important}}

function fillCard(pg,font,bold,rgb,p,sy,g,h,lang,dy){const H=841.9,K=rgb(0,0,0);
 const Y=ty=>H-(ty+dy);
 const X=(cx,cy)=>{const y=Y(cy);[[-3.6,0,-1.2,-3],[-1.2,-3,4,4]].forEach(l=>pg.drawLine({start:{x:cx+l[0],y:y+l[1]},end:{x:cx+l[2],y:y+l[3]},thickness:1.5,color:K}))};
 const txt=(s,x,base,size,maxw,center,f)=>{f=f||font;s=sf(s);if(!s)return;while(size>5.5&&f.widthOfTextAtSize(s,size)>maxw)size-=.5;while(s.length>1&&f.widthOfTextAtSize(s,size)>maxw)s=s.slice(0,-1);
  const w=f.widthOfTextAtSize(s,size);pg.drawText(s,{x:center?x-w/2:x,y:Y(base),size,font:f,color:K})};
 txt(p.name,h.nm[0],h.nm[1],11,320);txt(dmy(p.birth),h.bd[0],h.bd[1],10,200);txt(dmy(p.bapt),h.bp[0],h.bp[1],10,200);
 if(p.gender==='m')X(388.9,h.gy);if(p.gender==='f')X(490.3,h.gy);
 if(p.hope==='other_sheep')X(388.9,h.hy);if(p.hope==='anointed')X(490.3,h.hy);
 if(p.cat==='elder')X(h.el,h.py);if(p.cat==='ms')X(h.ms,h.py);if(p.type==='rp')X(h.rp,h.py);if(p.type==='sp')X(h.sp,h.py);if(p.miss)X(h.mi[0],h.mi[1]);
 txt(String(sy+1),59.5,g.yr,10,80,true,bold);
 let th=0,any=false;
 syMonths(sy).forEach(([y,m],i)=>{const r=rep(p.id,y,m);if(!r)return;const top=g.r0+i*g.pitch,base=top+g.base;
  if(r.shared)X(136.5,top+g.cy);
  if((r.pt||p.type)==='ap')X(277.7,top+g.cy);

async function exportS21(cards){toast(t('pdfWait'));
 try{await loadPdfLib();const{PDFDocument,StandardFonts,rgb}=PDFLib,lang=tplLang(),tp=TPL[lang],single=cards.length===1&&tp.single,kind=single?'single':'multi';
  const r=await fetch(tp[kind]);if(!r.ok)throw new Error('tpl');const bytes=await r.arrayBuffer();
  const out=await PDFDocument.create(),font=await out.embedFont(StandardFonts.Helvetica),bold=await out.embedFont(StandardFonts.HelveticaBold),g=GEO[kind],h=HDR[lang+':'+kind];
  const per=single?1:2;
  for(let i=0;i<cards.length;i+=per){const src=await PDFDocument.load(bytes),[pg]=await out.copyPages(src,[0]);out.addPage(pg);
   for(let k=0;k<per&&cards[i+k];k++){const c=cards[i+k];fillCard(pg,font,bold,rgb,S.pubs.find(p=>p.id===c.id),c.sy,g,h,lang,k?g.dy2:0)}}
  const u8=await out.save(),one=cards.every(c=>c.id===cards[0].id);
  dl((one?'S-21_'+sf(S.pubs.find(p=>p.id===cards[0].id).name).replace(/[^a-z0-9]+/gi,'_'):fname('fiches_S21'))+'_'+cards[0].sy+(cards.length>1&&one?'-'+cards[cards.length-1].sy:'')+'.pdf',u8,'application/pdf')
 }catch(e){toast(t('pdfErr'))}}
