<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1d2433;--mut:#6b7280;--pri:#6b1a1f;--acc:#e0aa3c;--line:#e3ddd0;--ok:#2e7d4f;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
header{background:var(--pri);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}header small{opacity:.75}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.item:last-child{border:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.mut{color:var(--mut);font-size:13px}
button,.btn{font:inherit;border:0;border-radius:9px;padding:9px 14px;background:var(--pri);color:#fff;cursor:pointer}
button.sec{background:#e9e4d6;color:var(--ink)}button.bad{background:var(--bad)}button.sm{padding:5px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;color:var(--ink);font-size:15px}.chk input{width:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:8px 2px;font-size:11px;color:var(--mut);cursor:pointer}nav a b{display:block;font-size:20px;font-weight:400}nav a.on{color:var(--pri);font-weight:700}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;background:#e9e4d6}.pill.ok{background:#dff3e3;color:var(--ok)}.pill.no{background:#fde0e0;color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.stat b{font-size:22px;display:block}
.modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modal>div{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid var(--line);padding:4px 6px;text-align:center}th{background:#e9e4d6}td:first-child,th:first-child{text-align:left}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:99px;z-index:30}
.lock{position:fixed;inset:0;background:var(--pri);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.lock input{max-width:200px;text-align:center;font-size:22px}
@keyframes sp{0%{opacity:0;transform:translateY(8px)}18%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}
.splash{position:fixed;inset:0;background:var(--pri);color:#fff;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px}
.splash .logo{width:84px;height:84px;border-radius:50%;background:var(--acc);color:var(--pri);display:grid;place-items:center;font:700 44px Georgia,serif}
.splash h1{font:700 30px Georgia,serif;margin:0;animation:sp 4s ease both}.splash p{font-size:19px;line-height:1.4;max-width:320px;margin:0;animation:sp 7.5s ease both}.splash small{opacity:.6;position:absolute;bottom:24px}
@media (prefers-reduced-motion:reduce){.splash h1,.splash p{animation:none}}
@media print{header,nav,.noprint,button{display:none!important}body{background:#fff;padding:0}.card{border:0}}

 ${S.invites.length?`<div class=card><h3>${t('invitesOpen')}</h3>${S.invites.map(v=>`<div class=item><div class=sp>${esc(v.name)}<div class=mut>${esc(v.identifier)}</div></div><button class="sm sec" onclick="cancelInvite('${esc(v.identifier)}')">${t('cancel')}</button></div>`).join('')}<div class=mut>${t('inviteLost')}</div></div>`:''}
 <div class=card><h3>${t('hoursSet')}</h3><div class=row><div style="flex:1"><label>${t('ap')}</label><input type=number value="${c.hours.ap}" onchange="setHours('ap',this.value)"></div><div style="flex:1"><label>${t('rp')}</label><input type=number value="${c.hours.rp}" onchange="setHours('rp',this.value)"></div><div style="flex:1"><label>${t('sp')}</label><input type=number value="${c.hours.sp}" onchange="setHours('sp',this.value)"></div></div></div>`}
function setHours(k,v){if(!guard())return;const n=v===''?null:+v;S.cg.hours[k]=n==null?'':n;const col={ap:'hours_aux',rp:'hours_reg',sp:'hours_spec'}[k];wr(()=>updw('cong_settings','congregation_id=eq.'+S.cg.id,{[col]:n}))}
function memberForm(id){const u=S.users.find(x=>x.id===id);
 modal(`<h3>${esc(u.name)}</h3><div class=mut>${esc(u.identifier)}</div><label>${t('cat')}</label><select id=mfC>${['publisher','ms','elder'].map(k=>`<option value=${k} ${u.category===k?'selected':''}>${t('cat_'+k)}</option>`).join('')}</select>
 <label>${t('functionsT')}</label>${FN.map(f=>`<label class=chk><input type=checkbox class=mfF value=${f} ${u.functions.includes(f)?'checked':''}> ${t('fn_'+f)}</label>`).join('')}
 <div class=row style="margin-top:12px"><button onclick="saveMember('${id}','${u.status==='pending'?'active':u.status}')">${u.status==='pending'?t('approve'):t('save')}</button><button class=sec onclick="closeM()">${t('cancel')}</button><span class=sp></span>${u.status==='active'&&u.id!==S.me.id?`<button class="bad sm" onclick="saveMember('${id}','disabled')">${t('disable')}</button>`:''}${u.status==='disabled'?`<button class=sm onclick="saveMember('${id}','active')">${t('enable')}</button>`:''}</div>
 ${u.status!=='pending'&&u.id!==S.me.id?`<div class=row style="margin-top:12px"><button class="sm sec" onclick="resetCode('${id}')">${t('resetCode')}</button></div><div class=mut>${t('resetHint')}</div>`:''}`)}
async function saveMember(id,st){if(!guard())return;const u=S.users.find(x=>x.id===id);const f=[...document.querySelectorAll('.mfF')].filter(x=>x.checked).map(x=>x.value);
 if(id===S.me.id&&!f.some(x=>x==='coordinator'||x==='secretary')){toast(t('keepAdmin'));return}
 const cat=$('#mfC').value;closeM();
 try{if(u.status==='pending')await rpc('approve_member',{p_profile:id,p_category:cat,p_functions:fD(f)});else await rpc('set_member',{p_profile:id,p_category:cat,p_functions:fD(f),p_status:st});toast(t('saved'))}catch(e){toast(errMsg(e))}
 await sync(true)}
async function makeInvite(){if(!guard())return;const i=fv('nmI').toLowerCase(),n=fv('nmN'),cat=$('#nmC').value;
 if(!n||!okId(i)){toast(t('fillAll'));return}
 try{const code=await rpc('create_invitation',{p_identifier:i,p_full_name:n,p_category:cat,p_functions:[]});
  modal(`<h3>${t('accCreated')}</h3><div class=card><div>${t('congNumber')}: <b>${esc(S.cg.number)}</b></div><div>${t('identifier')}: <b>${esc(i)}</b></div><div>${t('tempCode')}: <b style="font-size:22px;letter-spacing:2px">${esc(code)}</b></div></div><p class=mut>${t('giveMember')}</p><button onclick="closeM()">OK</button>`)}catch(e){toast(errMsg(e))}
 await sync(true)}
async function cancelInvite(i){if(!guard())return;try{await rpc('cancel_invitation',{p_identifier:i})}catch(e){toast(errMsg(e))}await sync(true)}
async function resetCode(id){if(delArm!=='rc'+id){delArm='rc'+id;toast(t('tapConfirm'));return}delArm=null;if(!guard())return;const u=S.users.find(x=>x.id===id);
 try{const code=await rpc('reset_member_code',{p_profile:id});closeM();modal(`<h3>${esc(u.name)}</h3><div class=card><div>${t('congNumber')}: <b>${esc(S.cg.number)}</b></div><div>${t('identifier')}: <b>${esc(u.identifier)}</b></div><div>${t('tempCode')}: <b style="font-size:22px;letter-spacing:2px">${esc(code)}</b></div></div><p class=mut>${t('giveMember')}</p><button onclick="closeM()">OK</button>`)}catch(e){toast(errMsg(e))}}

function groupForm(id){const g=S.groups.find(x=>x.id===id);
 modal(`<h3>${esc(g.name)}</h3><label>${t('name')}</label><input id=grN value="${esc(g.name)}"><label>${t('fn_group')}</label><select id=grO><option value="">${t('none')}</option>${S.pubs.map(p=>`<option value=${p.id} ${g.overseer===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
 <div class=row style="margin-top:12px"><button onclick="saveGroup('${id}')">${t('save')}</button><button class=sec onclick="closeM()">${t('cancel')}</button><span class=sp></span><button class="bad sm" onclick="delGroup('${id}');closeM()">${t('del')}</button></div>`)}
function saveGroup(id){if(!guard())return;const g=S.groups.find(x=>x.id===id);g.name=fv('grN')||g.name;g.overseer=$('#grO').value||'';closeM();render();wr(()=>updw('groups','id=eq.'+id,{name:g.name,overseer_id:g.overseer||null}))}
function hrsT(p){const c=CG();if(!c||!isPioneer(p))return '';return (c.hours&&c.hours[p.type])||''}
function pioBtns(p){const m=myPub();if(!m||m.id!==p.id||p.type!=='pub'||p.baptized===false)return '';
 if(S.pioreq.some(r=>r.pub===p.id&&r.status==='pending'))return `<div class=mut style="margin:8px 0">${t('pendingReq')}</div>`;
 return `<div class=row style="margin:8px 0"><button class="sm sec" onclick="reqPio('ap')">${t('requestAux')}</button><button class="sm sec" onclick="reqPio('rp')">${t('requestReg')}</button></div>`}
function reqPio(k){if(!guard())return;const m=myPub(),r={id:uid(),pub:m.id,kind:k,status:'pending'};S.pioreq.push(r);closeM();toast(t('saved'));render();wr(()=>ins('pioneer_requests',{id:r.id,congregation_id:S.cg.id,publisher_id:m.id,kind:PD[k],status:'pending'}))}
async function decidePio(id,ok){if(!guard())return;try{await rpc('decide_pioneer',{p_request:id,p_approve:ok})}catch(e){toast(errMsg(e))}await sync(true)}
